# =====================================================================
# secret-scan.yml   (folder: .github\workflows)
# SECRET SCAN: on every push and pull request, the tool "gitleaks" reads the code
# (and the history) and FAILS the run if it finds something that looks like a
# password, key or token. It catches a leaked secret BEFORE it goes live.
# If it fails: remove the secret from the code, then ROTATE it
# (infra\scripts\rotate-secrets.ps1), because Git history keeps old versions.
# =====================================================================
name: secret-scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download the code with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # whole history, so old commits are checked too

      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact --verbose