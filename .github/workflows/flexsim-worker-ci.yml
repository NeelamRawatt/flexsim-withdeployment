name: flexsim-worker CI

on:
  push:
    branches: [main, master]
    paths:
      - "services/flexsim-worker/**"
      - ".github/workflows/flexsim-worker-ci.yml"
  pull_request:
    paths:
      - "services/flexsim-worker/**"
      - ".github/workflows/flexsim-worker-ci.yml"

permissions:
  contents: read

concurrency:
  group: flexsim-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Stage 1: build the code and run all tests ----------
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/flexsim-worker
    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The worker has no mvnw: the GitHub machine already has Maven.
      - name: Build and test
        run: mvn -B verify

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flexsim-worker-test-reports
          path: services/flexsim-worker/target/surefire-reports
          if-no-files-found: ignore

  # ---------- Stage 2: the package for the Windows VM (no Docker: FlexSim runs on Windows) ----------
  package:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/flexsim-worker
    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build the jar
        run: mvn -B -DskipTests package

      - name: Save the package (jar + service files)
        uses: actions/upload-artifact@v4
        with:
          name: flexsim-worker-package
          path: |
            services/flexsim-worker/target/flexsim-worker.jar
            services/flexsim-worker/deploy/windows/flexsim-worker.xml
            services/flexsim-worker/deploy/windows/install-worker-service.ps1
            services/flexsim-worker/.env.example
          retention-days: 30

      # ---------- Stage 3: security scan (report only for now) ----------
      - name: Scan libraries for known security holes
        run: |
          docker run --rm -v "$PWD":/project -w /project aquasec/trivy:0.57.1 \
            fs --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 0 .