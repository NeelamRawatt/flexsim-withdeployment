name: kpi-service CI

on:
  push:
    branches: [main, master]
    paths:
      - "services/kpi-service/**"
      - ".github/workflows/kpi-service-ci.yml"
  pull_request:
    paths:
      - "services/kpi-service/**"
      - ".github/workflows/kpi-service-ci.yml"

permissions:
  contents: read

concurrency:
  group: kpi-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Stage 1: build the code and run all tests (Testcontainers uses the machine's Docker) ----------
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/kpi-service
    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # kpi-service has no mvnw: the GitHub machine already has Maven.
      - name: Build and test
        run: mvn -B verify

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kpi-service-test-reports
          path: services/kpi-service/target/surefire-reports
          if-no-files-found: ignore

  # ---------- Stage 2: build the Docker image ----------
  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/kpi-service
    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t kpi-service:ci .

      - name: Show the image
        run: docker image ls kpi-service

      # ---------- Stage 3: security scan (report only for now) ----------
      - name: Scan libraries for known security holes
        run: |
          docker run --rm -v "$PWD":/project -w /project aquasec/trivy:0.57.1 \
            fs --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 0 .

      - name: Scan the Docker image for known security holes
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.57.1 \
            image --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 0 kpi-service:ci

  # ---------- Stage 4: CD = put it live on the Azure DEV cluster ----------
  # Only after build + tests + image build passed, and only for pushes to main
  # (not for pull requests). Uses the shared deploy recipe (reusable workflow).
  deploy-dev:
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write     # needed for the Azure login without a password (OIDC)
    uses: ./.github/workflows/deploy-service-dev.yml
    with:
      service: kpi-service