# =====================================================================
# application.properties = the settings of experiment-service.
# Rule: NO real passwords or secrets in this file (it goes to Git).
#       Secrets come from the .env file (development) or from real
#       environment variables (Docker, Kubernetes), written as ${NAME}.
#
# How ${NAME:default} works:
#   ${NAME}          -> use the variable NAME. If it is missing, the service
#                       refuses to start. This is GOOD ("fail fast"): you learn
#                       about the problem at start, not in the middle of a
#                       customer's request.
#   ${NAME:default}  -> use NAME, or "default" if NAME is missing.
# =====================================================================
spring.application.name=experiment-service

# Port = the numbered door of this service (our plan: experiment-service = 8082).
server.port=8082

# ---- This service's OWN .env file ----------------------------------
# While you develop, Spring reads services/experiment-service/.env.
# "optional:" = if the file is not there (in Docker or Kubernetes the real
# environment variables are used), just skip it.
spring.config.import=optional:file:./.env[.properties]

# ---- Database: experiment_db (this service's OWN database and OWN user) ----
# No default for the user and password on purpose: they must be given.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/experiment_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# ---- Hibernate: only CHECK the tables, never change them ------------
# Flyway creates and changes the tables. If a Java class does not match a table,
# the service stops at start and tells you why.
spring.jpa.hibernate.ddl-auto=validate

# Open-in-view = Spring keeps a database connection open during the WHOLE web
# request, even while it writes the JSON answer. That wastes connections and hides
# lazy-loading mistakes. We switch it off (a standard production setting).
spring.jpa.open-in-view=false

# ---- Flyway: runs the SQL files in db/migration, in version order --
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- Actuator: health pages for Kubernetes and monitoring ----------
# Only "health" and "info" are visible. Never expose everything in production.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# ---- Security: checking the login token --------------------------------
# This service does NOT create tokens. It only CHECKS the token that
# auth-service created. So the secret MUST be exactly the same as in auth-service.
# No default on purpose: if it is missing, the service refuses to start.
app.security.jwt.secret=${APP_JWT_SECRET}

# Website addresses that may call this service from a browser (comma separated).
app.security.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:3000}

# ---- Never show Java error details to the outside --------------------
server.error.include-stacktrace=never
server.error.include-message=never