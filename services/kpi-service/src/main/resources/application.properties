# =====================================================================
# application.properties = the settings of kpi-service.
# Rule: NO real passwords here (this file goes to Git). Secrets come from .env or real environment variables.
#   ${NAME}          -> must be given, else the service refuses to start ("fail fast")
#   ${NAME:default}  -> use NAME, or "default" if NAME is missing
# =====================================================================
spring.application.name=kpi-service

# Port = the numbered door of this service (our plan: kpi-service = 8084).
server.port=8084

# ---- This service's OWN .env file (development only) ----------------
spring.config.import=optional:file:./.env[.properties]

# ---- Database: kpi_db (this service's OWN database and OWN user kpi_user) ----
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/kpi_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# ---- Hibernate: only CHECK the tables, never change them ------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---- Flyway: runs the SQL files in db/migration, in version order --
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- Actuator: health pages for Docker / Kubernetes ----------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# ---- Security: CHECK the token made by auth-service (same secret as auth-service) ----
app.security.jwt.secret=${APP_JWT_SECRET}
app.security.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:3000}

# ---- Never show Java error details to the outside --------------------
server.error.include-stacktrace=never
server.error.include-message=never

# ============================================================
# KAFKA
# ============================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Consumer: ONE group for all copies of kpi-service -> each KPI snapshot is SAVED once.
# (The live-stream listener sets its own random group in the code: every copy gets every snapshot.)
spring.kafka.consumer.group-id=kpi-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
# KPI messages are gzip-compressed by the worker; Kafka unpacks them for us. Bigger messages are OK:
spring.kafka.consumer.properties.max.partition.fetch.bytes=5242880
# false = listeners don't start (the integration test has no Kafka).
spring.kafka.listener.auto-startup=${APP_KAFKA_LISTENERS_ENABLED:true}

# Producer: ONLY used to put broken messages into the DLT ("failed messages" topic).
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# ============================================================
# SSE (live KPI stream for the browser)
# ============================================================
app.sse.timeout-ms=1800000
app.sse.heartbeat-ms=20000
app.sse.max-viewers-per-experiment=20
