# =====================================================================
# application.properties = the settings of simulation-service.
# Rule: NO real passwords or secrets in this file (it goes to Git).
#       Secrets come from the .env file (development) or from real
#       environment variables (Docker, Kubernetes), written as ${NAME}.
#   ${NAME}          -> must be given, else the service refuses to start ("fail fast")
#   ${NAME:default}  -> use NAME, or "default" if NAME is missing
# =====================================================================
spring.application.name=simulation-service

# Port = the numbered door of this service (our plan: simulation-service = 8083).
server.port=8083

# ---- This service's OWN .env file (development only) ----------------
spring.config.import=optional:file:./.env[.properties]

# ---- Database: simulation_db (this service's OWN database and OWN user) ----
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/simulation_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# ---- Hibernate: only CHECK the tables, never change them ------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---- Flyway: runs the SQL files in db/migration, in version order --
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- Actuator: health pages for Kubernetes and monitoring ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# ---- Security: checking the login token --------------------------------
# This service does NOT create tokens. It only CHECKS the token that
# auth-service created. So the secret MUST be exactly the same as in auth-service.
# No default on purpose: if it is missing, the service refuses to start.
app.security.jwt.secret=${APP_JWT_SECRET}

# Website addresses that may call this service from a browser (comma separated).
app.security.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:3000}

# ---- Other services this service calls (REST) -------------------------
# On your laptop: localhost. In Docker the compose file sets the container names.
app.services.experiment.base-url=${EXPERIMENT_SERVICE_URL:http://localhost:8082}
app.services.file.base-url=${FILE_SERVICE_URL:http://localhost:8086}
# Give up after these times instead of waiting for ever (milliseconds).
app.services.connect-timeout-ms=2000
app.services.read-timeout-ms=5000

# ============================================================
# KAFKA (producer) - used by the outbox sender (OutboxPublisher)
# ============================================================
# Where Kafka is. On your laptop: localhost:9092.
# Inside Docker, docker-compose.services.yml changes it to kafka:29092.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Key and value are plain text (the key is the experimentId, the value is the JSON).
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# acks=all = Kafka says "received" only after the message is safely stored.
spring.kafka.producer.acks=all
# Idempotence = if the producer retries, Kafka still keeps the message only ONCE.
spring.kafka.producer.properties.enable.idempotence=true

# Do not wait forever when Kafka is down (milliseconds).
spring.kafka.producer.properties.max.block.ms=10000
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.delivery.timeout.ms=20000

# ============================================================
# OUTBOX sender settings
# ============================================================
# false = the sender does not run (used by the integration test).
app.outbox.enabled=${APP_OUTBOX_ENABLED:true}
# How often to look for unsent rows (milliseconds).
app.outbox.poll-interval-ms=2000
# Max rows per round.
app.outbox.batch-size=100
# How long to wait for Kafka's "received" per message (seconds).
app.outbox.send-timeout-seconds=25
# Delete SENT rows older than this many days (daily cleanup).
app.outbox.retention-days=7

# ---- Never show Java error details to the outside --------------------
server.error.include-stacktrace=never
server.error.include-message=never

# ============================================================
# KAFKA (consumer) - used by SimulationStatusSseListener (live screen news)
# ============================================================
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# false = listeners don't start (the integration test has no Kafka).
spring.kafka.listener.auto-startup=${APP_KAFKA_LISTENERS_ENABLED:true}

# ============================================================
# SSE (live progress for the browser)
# ============================================================
# Close a pipe after 30 minutes (the browser reconnects by itself if the page is still open).
app.sse.timeout-ms=1800000
# Send a tiny "ping" every 20 seconds, so proxies don't close a quiet connection.
app.sse.heartbeat-ms=20000
# Protection: max open pipes per experiment, on one copy of the service.
app.sse.max-viewers-per-experiment=20
# ============================================================
# KAFKA (consumer group) - used by ExperimentDeletedListener
# ============================================================
# ONE group for all copies of simulation-service: each delete message is handled ONCE.
# (The SSE listener sets its own random group in the code, so it is not affected.)
spring.kafka.consumer.group-id=simulation-service
# First start of this group: read from the oldest message still kept (no delete is missed).
# (The SSE listener overrides this with "latest" in the code.)
spring.kafka.consumer.auto-offset-reset=earliest
# We decide when a message counts as "done", not a timer.
spring.kafka.consumer.enable-auto-commit=false
# "record" = mark each message done right after the listener finished it without error.
spring.kafka.listener.ack-mode=record

# ============================================================
# Stuck-run check (StuckRunCleanupService)
# ============================================================
# RUNNING longer than this -> FAILED. MUST be longer than the worker's own limit (FLEXSIM_MAX_RUN_MINUTES = 360).
app.runs.stuck-running-after-minutes=420
# QUEUED longer than this -> FAILED (no worker ever took the job).
app.runs.stuck-queued-after-hours=24
# How often to check (milliseconds): every 15 minutes.
app.runs.stuck-check-ms=900000
