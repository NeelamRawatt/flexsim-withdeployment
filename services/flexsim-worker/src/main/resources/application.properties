# =====================================================================
# application.properties = the settings of flexsim-worker.
# Rule: NO real passwords in this file (it goes to Git).
#   ${NAME}          -> must be given, else the worker refuses to start ("fail fast")
#   ${NAME:default}  -> use NAME, or "default" if NAME is missing
# =====================================================================
spring.application.name=flexsim-worker

# Port = the numbered door of this program (our plan: flexsim-worker = 8090).
server.port=8090
# 127.0.0.1 = "this computer only". Only FlexSim, on the SAME VM, may call the worker.
# Nobody from the network can reach port 8090, so this small API needs no login.
server.address=127.0.0.1

# ---- This program's OWN .env file (development only) ----------------
spring.config.import=optional:file:./.env[.properties]

# ---- The worker's own login (the WORKER service account from W1) ----
# The password MUST be the same as APP_BOOTSTRAP_WORKER_PASSWORD in auth-service.
# No default on purpose: if it is missing, the worker refuses to start.
app.worker.username=${APP_WORKER_USERNAME:flexsim-worker}
app.worker.password=${APP_WORKER_PASSWORD}

# true = log in once at start-up, so a wrong password is found AT ONCE (not hours later at the first job).
app.worker.startup-login-check=${APP_WORKER_STARTUP_LOGIN_CHECK:true}

# ---- Other services this program calls (REST) ------------------------
# On your laptop: localhost. On Azure: the real addresses (set as environment variables).
app.services.auth.base-url=${AUTH_SERVICE_URL:http://localhost:8081}
app.services.simulation.base-url=${SIMULATION_SERVICE_URL:http://localhost:8083}
# Give up after these times instead of waiting for ever (milliseconds).
app.services.connect-timeout-ms=2000
app.services.read-timeout-ms=5000

# ---- Actuator: health page (http://localhost:8090/actuator/health) --
management.endpoints.web.exposure.include=health,info

# ---- Never show Java error details to the outside --------------------
server.error.include-stacktrace=never
server.error.include-message=never

# ============================================================
# W3: FLEXSIM (where it is, where each run works, time limits)
# ============================================================
# The FlexSim program. On the Azure VM it is the same folder as on your laptop.
app.flexsim.exe-path=${FLEXSIM_EXE_PATH:C:/Program Files/FlexSim 2025/program/flexsim.exe}
# The model file. No default on purpose: a wrong model must never run by surprise.
app.flexsim.model-path=${FLEXSIM_MODEL_PATH}
# Each run gets its OWN folder here: run-<runId>\ with a model copy, script.txt and flexsim-output.log.
app.flexsim.work-dir=${FLEXSIM_WORK_DIR:./flexsim-runs}
# A run that is not finished after this many minutes is stopped and marked FAILED.
app.flexsim.max-run-minutes=${FLEXSIM_MAX_RUN_MINUTES:360}
# After FlexSim says "finished", wait this long for it to close by itself, then close it (frees the licence).
app.flexsim.exit-grace-seconds=60
# true = at start-up, check that the program and the model file exist (stop the worker if not).
app.flexsim.startup-check=${APP_FLEXSIM_STARTUP_CHECK:true}

# ============================================================
# W3: KAFKA - receive the jobs (topic simulation.trigger.requested)
# ============================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# ONE group for all workers: each job is done by ONE worker only.
spring.kafka.consumer.group-id=flexsim-worker
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# We decide when a job counts as "done" (after the run is finished), not a timer.
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
# Take ONE job at a time per thread (do not hold 5 jobs while 1 is running).
spring.kafka.consumer.max-poll-records=1
# A run can take hours. Kafka must not think the worker is dead while FlexSim runs.
# MUST be longer than max-run-minutes (360 min = 6 h). 8 h = 28800000 ms.
spring.kafka.consumer.properties.max.poll.interval.ms=28800000
# false = listeners don't start (the start-up test has no Kafka).
spring.kafka.listener.auto-startup=${APP_KAFKA_LISTENERS_ENABLED:true}
# How many runs at the same time = FlexSim licences on this VM (also = partitions of the topic).
app.worker.max-parallel-runs=${APP_WORKER_MAX_PARALLEL_RUNS:4}

# Producer: ONLY used to put broken jobs into simulation.trigger.requested.DLT.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
