spring.application.name=auth-service
server.port=8081
# ---- This service's OWN .env file ----------------------------------
# While you develop, Spring reads services/auth-service/.env, so you do not need
# to set Windows environment variables by hand. "optional:" means: if the file is
# not there (in Docker or Kubernetes the real environment variables are used),
# just skip it.
spring.config.import=optional:file:./.env[.properties]
# ---- Database: auth_db (this service's OWN database and OWN user) ---
# No default for the user and password on purpose: they must be given.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/auth_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# ---- Hibernate: only CHECK the tables, never change them -----------
# Flyway creates and changes the tables. If a Java class does not match the table,
# the service stops at start and tells you why. (In production, "update" is dangerous:
# it can quietly change a real table.)
spring.jpa.hibernate.ddl-auto=validate
# ---- Flyway: runs the SQL files in db/migration, in version order --
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# ---- Actuator: health pages for Kubernetes and monitoring ----------
# Only "health" and "info" are visible. Never expose everything in production.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
# ---- Security: login tokens (values come from .env now, Azure Key Vault later) ----
# The secret that signs login tokens. NO default on purpose: if it is missing,
# the service refuses to start.
app.security.jwt.secret=${APP_JWT_SECRET}
# The short token lives 10 minutes. The refresh token lives 1 hour.
app.security.jwt.access-token-minutes=10
app.security.refresh-token-hours=1
# Website addresses that may call this service from a browser (comma separated).
app.security.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:3000}
# true = cookies travel only over HTTPS. Set APP_COOKIE_SECURE=true in production.
app.security.cookie.secure=${APP_COOKIE_SECURE:false}
 
# ---- First "developer" user (OFF by default) ----
app.security.bootstrap.developer.enabled=${APP_BOOTSTRAP_DEVELOPER_ENABLED:false}
app.security.bootstrap.developer.username=${APP_BOOTSTRAP_DEVELOPER_USERNAME:developer}
app.security.bootstrap.developer.password=${APP_BOOTSTRAP_DEVELOPER_PASSWORD:}


# ---- Errors: never send stack traces to the client ----
server.error.include-stacktrace=never
server.error.include-message=never