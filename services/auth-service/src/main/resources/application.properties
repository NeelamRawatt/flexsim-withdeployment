spring.application.name=auth-service
server.port=8081
# ---- This service's OWN .env file ----------------------------------
# While you develop, Spring reads services/auth-service/.env, so you do not need
# to set Windows environment variables by hand. "optional:" means: if the file is
# not there (in Docker or Kubernetes the real environment variables are used),
# just skip it.
spring.config.import=optional:file:./.env[.properties]
# ---- Database: auth_db (this service's OWN database and OWN user) ---
# No default for the user and password on purpose: they must be given.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/auth_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# ---- Hibernate: only CHECK the tables, never change them -----------
# Flyway creates and changes the tables. If a Java class does not match the table,
# the service stops at start and tells you why. (In production, "update" is dangerous:
# it can quietly change a real table.)
spring.jpa.hibernate.ddl-auto=validate
# ---- Flyway: runs the SQL files in db/migration, in version order --
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# ---- Actuator: health pages for Kubernetes and monitoring ----------
# Only "health" and "info" are visible. Never expose everything in production.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
