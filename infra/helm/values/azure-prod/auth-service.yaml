# =====================================================================
# auth-service.yaml   (folder: infra\helm\values\azure-prod)
# The "guest list" for auth-service in AZURE PRODUCTION (company subscription, AKS).
# Fill every <...> with the real production names (Terraform outputs of the prod apply).
# Same chart as the laptop; only these answers differ.
#
# NOT written here (they change after every destroy/apply), given at deploy time
# by the deploy-prod GitHub workflow:
#   azureWorkloadIdentity.clientId   (app_identity_client_id)
#   keyVault.tenantId                (tenant_id)
#
# NO PASSWORDS HERE. Passwords stay in Key Vault; "keyVault.secrets" only lists
# their LABELS (env variable name: key-vault-label).
# =====================================================================

name: auth-service
port: 8081

# Production: 2 copies (one can restart/upgrade while the other serves users)
replicaCount: 2


image:
  repository: <PROD-ACR-NAME>.azurecr.io/auth-service   # from our Azure registry (ACR)
  tag: "0.1.0"

# Azure features ON
serviceAccount:
  create: true            # Kubernetes ID card "auth-service" (Terraform trusts it)
azureWorkloadIdentity:
  enabled: true           # clientId is given by the deploy script
keyVault:
  enabled: true
  name: <PROD-KEY-VAULT-NAME>   # tenantId is given by the deploy script
  # Key Vault label for each secret env variable (ENV_NAME: key-vault-label)
  secrets:
    POSTGRES_PASSWORD: auth-db-password
    APP_JWT_SECRET: jwt-secret
    APP_BOOTSTRAP_DEVELOPER_PASSWORD: auth-developer-password
    APP_BOOTSTRAP_WORKER_PASSWORD: auth-worker-password

# Behind the shared main gate: requests starting with these paths come to this service
gateway:
  enabled: true
  sectionName: https    # routes ONLY on the https listener (http redirects to https)
  paths:
    - "/api/auth"
    - "/api/users"

# Non-secret settings -> ConfigMap -> environment variables
config:
  # Dev DB (B1ms) allows only 50 connections in total. Spring's default is 10 per service,
  # so 5 services would use them all. Cap each service at 4 (about 20 in total).
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 4
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
  # Private Azure PostgreSQL (found by name through the private DNS zone)
  POSTGRES_HOST: <PROD-POSTGRES-SERVER>.postgres.database.azure.com
  POSTGRES_PORT: 5432
  POSTGRES_USER: auth_user    # not secret (the password is in Key Vault)
  # Browser origin allowed to call the API = the real https address of the app
  APP_ALLOWED_ORIGINS: https://<PROD-DOMAIN>
  # Cookies only over HTTPS in Azure (production setting)
  APP_COOKIE_SECURE: true
  # Create the first login users at first start (passwords come from Key Vault)
  APP_BOOTSTRAP_DEVELOPER_ENABLED: false   # prod: no developer test account
  APP_BOOTSTRAP_DEVELOPER_USERNAME: developer
  APP_BOOTSTRAP_WORKER_ENABLED: true
  APP_BOOTSTRAP_WORKER_USERNAME: flexsim-worker
