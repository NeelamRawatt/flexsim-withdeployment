{{- /*
=====================================================================
secretproviderclass.yaml   (folder: infra\helm\flexsim-service\templates)
The HELPER'S LIST for the Key Vault add-on (Secrets Store CSI driver, Azure provider):
  "fetch THESE secrets from Key Vault (logging in as the pods' Azure ID card)
   and copy them into the Kubernetes Secret <name>-secret under THESE names".
The pod already reads <name>-secret with envFrom, so the app code does not change.
Made ONLY when keyVault.enabled = true (Azure). Laptop: nothing is made.
keyVault.secrets is a map:  ENV_VARIABLE_NAME: key-vault-secret-label
=====================================================================
*/ -}}
{{- if .Values.keyVault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "flexsim-service.name" . }}-kv
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flexsim-service.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"     # use workload identity (the old "pod identity" is retired)
    clientID: {{ required "values: 'azureWorkloadIdentity.clientId' is required when keyVault.enabled is true" .Values.azureWorkloadIdentity.clientId | quote }}
    keyvaultName: {{ required "values: 'keyVault.name' is required when keyVault.enabled is true" .Values.keyVault.name | quote }}
    tenantId: {{ required "values: 'keyVault.tenantId' is required when keyVault.enabled is true" .Values.keyVault.tenantId | quote }}
    # WHICH secrets to fetch (one entry per secret in keyVault.secrets)
    objects: |
      array:
      {{- range $env, $kvName := .Values.keyVault.secrets }}
        - |
          objectName: {{ $kvName }}
          objectType: secret
      {{- end }}
  # WHERE to put them: the Kubernetes Secret the pod reads (KV label -> env variable name)
  secretObjects:
    - secretName: {{ include "flexsim-service.secretName" . }}
      type: Opaque
      data:
      {{- range $env, $kvName := .Values.keyVault.secrets }}
        - objectName: {{ $kvName }}
          key: {{ $env }}
      {{- end }}
{{- end }}
