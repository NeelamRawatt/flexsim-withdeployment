{{- /*
=====================================================================
serviceaccount.yaml   (folder: infra\helm\flexsim-service\templates)
The service's Kubernetes "ID card" (ServiceAccount), named like the service.
Made ONLY when serviceAccount.create = true (Azure). Laptop: nothing is made.
With workload identity ON, the annotation links it to the Azure ID card
(Terraform output app_identity_client_id). Terraform trusts exactly
system:serviceaccount:flexsim:<service-name>.
=====================================================================
*/ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flexsim-service.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flexsim-service.labels" . | nindent 4 }}
  {{- if .Values.azureWorkloadIdentity.enabled }}
  annotations:
    # The link: "this Kubernetes ID card belongs to THIS Azure ID card".
    azure.workload.identity/client-id: {{ required "values: 'azureWorkloadIdentity.clientId' is required when azureWorkloadIdentity.enabled is true" .Values.azureWorkloadIdentity.clientId | quote }}
  {{- end }}
{{- end }}
