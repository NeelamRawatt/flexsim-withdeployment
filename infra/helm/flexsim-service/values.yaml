# =====================================================================
# values.yaml   (folder: infra\helm\flexsim-service)
# The DEFAULT answers for every blank {{ .Values.xxx }} in the templates.
#
# How values are mixed:
#   this file (defaults)
#     + values\local\auth-service.yaml (only what is DIFFERENT for auth)
#     = final values
# The file given LATER wins. So a service file only needs the lines that differ.
#
# Lines marked REQUIRED have no useful default: every service file MUST set them.
# =====================================================================

# ---------------------------------------------------------------------
# name: the service name. Used for the Deployment, the Service, the labels
# and the container. Other pods find this service by this name (cluster DNS):
#   http://auth-service:8081
# REQUIRED. Example: auth-service
# ---------------------------------------------------------------------
name: ""

# ---------------------------------------------------------------------
# port: the port Spring Boot listens on (server.port).
# Used for the container port, the Service port AND the health checks.
# REQUIRED. Example: 8081
# ---------------------------------------------------------------------
port: 0

# How many copies (pods) to run. 1 on the laptop; more in production.
replicaCount: 1

# ---------------------------------------------------------------------
# image: which Docker image to run.
#   repository = the image name WITHOUT the tag.
#                Laptop: auth-service
#                Azure : <our-registry>.azurecr.io/auth-service   (later)
#                Left empty -> the template uses "name" (auth-service).
#   tag        = the version. REQUIRED. Never "latest" in production:
#                "latest" changes silently, so you never know what is running.
#   pullPolicy = IfNotPresent: use the image already on the machine,
#                download only if it is missing.
# ---------------------------------------------------------------------
image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

# ---------------------------------------------------------------------
# service: how other pods reach this app.
# ClusterIP = reachable only INSIDE the cluster (safe default).
# Outside traffic will come through the Gateway later (step D3), not directly.
# ---------------------------------------------------------------------
service:
  type: ClusterIP

# ---------------------------------------------------------------------
# config: the NON-secret settings. They become the ConfigMap
# and then environment variables in the container.
# Each service file fills this with its own settings (POSTGRES_HOST, ...).
# NEVER put passwords here: values files go into Git.
# {} = empty list by default.
# ---------------------------------------------------------------------
config: {}

# ---------------------------------------------------------------------
# secretName: the name of the Secret that holds the passwords.
# The chart does NOT create it. You create it yourself with:
#   kubectl create secret generic auth-service-secret --from-env-file=...
# (Later in Azure, Key Vault fills it.)
# Left empty -> the template uses "<name>-secret", e.g. auth-service-secret.
# ---------------------------------------------------------------------
secretName: ""

# ---------------------------------------------------------------------
# resources: CPU and memory.
#   requests = what Kubernetes RESERVES (used to pick a node with room)
#   limits   = the MAXIMUM. Over the memory limit -> the pod is killed (OOMKilled).
# 250m = a quarter of one CPU core. Mi = mebibytes (about megabytes).
# No CPU limit on purpose: a CPU limit slows Java down (it is "throttled"),
# especially at startup. Memory limit is kept: memory cannot be "slowed", only killed.
# ---------------------------------------------------------------------
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 768Mi

# ---------------------------------------------------------------------
# probes: health checks (Spring Boot Actuator pages).
#   startup   = "has it finished starting?"  Up to 60 x 5 s = 5 minutes.
#               (Was 24 = 2 minutes. Too short when several Java apps start at
#               the SAME time on a small machine: they share the CPU and start slowly.
#               A long startup limit is safe: it is only used ONCE, at start.
#               After start, liveness takes over with its short 30 s limit.)
#               While this runs, the other two probes wait.
#   liveness  = "is it stuck?"   NO -> restart the container.
#               Does NOT check the database on purpose (a DB problem
#               should not restart every pod).
#   readiness = "can it take calls now?"  NO -> no calls are sent to it.
# ---------------------------------------------------------------------
probes:
  startup:
    path: /actuator/health/liveness
    periodSeconds: 5
    failureThreshold: 60
  liveness:
    path: /actuator/health/liveness
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /actuator/health/readiness
    periodSeconds: 5
    failureThreshold: 3

# ---------------------------------------------------------------------
# securityContext: safety rules for the container.
# allowPrivilegeEscalation: false = the program can never gain extra powers.
# (Our Dockerfiles already run the app as the normal user "app", not root.)
# ---------------------------------------------------------------------
securityContext:
  allowPrivilegeEscalation: false

# =====================================================================
# AZURE FEATURES (all OFF by default -> the laptop setup is unchanged).
# The Azure values files (values\azure-dev\*.yaml) switch them ON.
# =====================================================================

# serviceAccount: create a Kubernetes "ID card" for this service
# (named like the service, e.g. auth-service).
serviceAccount:
  create: false

# azureWorkloadIdentity: link that Kubernetes ID card to the Azure ID card
# (the pods' managed identity). clientId = Terraform output "app_identity_client_id".
azureWorkloadIdentity:
  enabled: false
  clientId: ""

# keyVault: take the passwords from Azure Key Vault (instead of "kubectl create secret").
#   name     = Key Vault name (e.g. kv-flexsim-dev-neelam)
#   tenantId = Terraform output "tenant_id"
#   secrets  = map  ENV_VARIABLE_NAME: key-vault-secret-label
#              e.g. POSTGRES_PASSWORD: auth-db-password
# The helper (Secrets Store CSI driver) copies them into the Kubernetes Secret
# "<name>-secret", which the pod already reads with envFrom.
keyVault:
  enabled: false
  name: ""
  tenantId: ""
  secrets: {}

# ---------------------------------------------------------------------
# strategy: how a new version replaces the old one.
# Default (Kubernetes' own): start the NEW pod first, then stop the old one (needs spare CPU).
# On a tiny node (azure-dev) the script overrides maxSurge to 0: stop old first, then start new.
# ---------------------------------------------------------------------
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%

# gateway: put this service behind the shared main gate (Azure Application Gateway for Containers).
#   enabled    = make the HTTPRoute + HealthCheckPolicy (Azure only; laptop: OFF)
#   name       = the shared Gateway object (created once by deploy-azure-dev.ps1)
#   paths      = URL prefixes that belong to this service, e.g. ["/api/auth", "/api/users"]
#   healthPath = what the gateway calls to check the service is alive
#                (the default "/" answers 401/404 in our apps -> would look "broken")
gateway:
  enabled: false
  name: flexsim-gateway
  paths: []
  healthPath: /actuator/health/readiness
  # sectionName: attach only to ONE listener of the Gateway. Empty = all listeners (dev: http only).
  # prod: "https" (the http listener only redirects to https).
  sectionName: ""
