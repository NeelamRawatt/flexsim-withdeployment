# =====================================================================
# service.yaml  (folder: infra\k8s\kpi-service)
# ONE fixed name and address for all kpi-service pods: http://kpi-service:8084
# ClusterIP = reachable only INSIDE the cluster.
# =====================================================================
apiVersion: v1
kind: Service
metadata:
  name: kpi-service
  namespace: flexsim
spec:
  type: ClusterIP
  selector:
    app: kpi-service
  ports:
    - port: 8084
      targetPort: 8084
