# =====================================================================
# service.yaml  (folder: infra\k8s\auth-service)
# ONE fixed name and address for all auth-service pods: http://auth-service:8081
# ClusterIP = reachable only INSIDE the cluster. Users come in later through the Gateway (front door).
# =====================================================================
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: flexsim
spec:
  type: ClusterIP
  selector:
    app: auth-service        # send calls to every pod with this name tag
  ports:
    - port: 8081             # the port callers use
      targetPort: 8081       # the port inside the pod