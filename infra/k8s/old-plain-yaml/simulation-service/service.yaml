# =====================================================================
# service.yaml  (folder: infra\k8s\simulation-service)
# ONE fixed name and address for all simulation-service pods: http://simulation-service:8083
# ClusterIP = reachable only INSIDE the cluster.
# =====================================================================
apiVersion: v1
kind: Service
metadata:
  name: simulation-service
  namespace: flexsim
spec:
  type: ClusterIP
  selector:
    app: simulation-service
  ports:
    - port: 8083
      targetPort: 8083
